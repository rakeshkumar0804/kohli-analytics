name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-build:
    name: Verify, Test, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Derived Analytics & Calibration Artifacts
        run: |
          npm run clutch:calibrate
          npm run analytics:derive
          npm run data:verify
          npm run validate:data

      - name: Run Unit & Regression Tests
        run: npm test

      - name: Run Data Integration Tests
        run: npm run test:data-integration

      - name: Run Linter
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Check Production Security Audit
        run: npm audit --omit=dev
